<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zebar2k</title>
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body>
    <div class="bar">
      <!-- Left Section: GlazeWM Workspaces, Binding Modes, Active Window -->
      <div class="section-left">
        <div id="workspaces" class="workspaces"></div>
        <div id="binding-modes" class="binding-modes"></div>
        <button id="paused-badge" class="paused-badge" style="display: none;">PAUSED</button>
        <span class="separator" id="window-separator" style="display: none;">│</span>
        <div id="window-title" class="window-title" style="display: none;">
          <span class="icon"></span>
          <span id="window-title-text" class="window-title-text"></span>
        </div>
      </div>

      <!-- Center Section: Dead-center Clock (all the time) -->
      <div class="section-center">
        <div id="clock-block" class="status-block clock-center" title="Click to open Notification Center & Calendar">
          <span class="icon">󰥔</span>
          <span id="clock-text">--:--</span>
        </div>
      </div>

      <!-- Right Section: Media Player + Statusline blocks -->
      <div class="section-right">
        <!-- Media Player (Uniform with status blocks) -->
        <div id="media-player" class="status-block media-block" style="display: none;">
          <span id="media-prev" class="media-ctrl" title="Previous">󰒮</span>
          <span id="media-toggle" class="media-ctrl" title="Play/Pause">󰐊</span>
          <span id="media-next" class="media-ctrl" title="Next">󰒭</span>
          <span class="icon media-icon">󰎆</span>
          <span id="media-title" class="media-title"></span>
          <span id="media-artist" class="media-artist"></span>
        </div>
        <span class="separator" id="media-separator" style="display: none;">│</span>

        <!-- Volume -->
        <div id="volume-block" class="status-block" title="Left click to mute/unmute, Scroll to adjust volume">
          <span id="volume-icon" class="icon">󰕾</span>
          <span id="volume-text">--%</span>
        </div>

        <span class="separator">│</span>

        <!-- Bandwidth / Network -->
        <div id="net-block" class="status-block" title="Network Settings">
          <span id="net-icon" class="icon"></span>
          <span id="net-text"> 0 B/s</span>
        </div>

        <span class="separator">│</span>

        <!-- CPU Usage -->
        <div id="cpu-block" class="status-block" title="CPU Usage (Click for Task Manager)">
          <span class="icon">󰍛</span>
          <span id="cpu-text">00%</span>
        </div>

        <span class="separator">│</span>

        <!-- Memory -->
        <div id="mem-block" class="status-block" title="RAM Usage (Click for Task Manager)">
          <span class="icon">󰘚</span>
          <span id="mem-text">0.0 GiB</span>
        </div>

        <span class="separator" id="disk-separator">│</span>

        <!-- Disk -->
        <div id="disk-block" class="status-block" title="Disk Space (Click for File Explorer)">
          <span class="icon">󰋊</span>
          <span id="disk-text">-- GiB</span>
        </div>

        <span class="separator" id="battery-separator" style="display: none;">│</span>

        <!-- Battery -->
        <div id="battery-block" class="status-block" style="display: none;">
          <span id="battery-icon" class="icon">󰁹</span>
          <span id="battery-text">--%</span>
        </div>

        <span class="separator" id="systray-separator" style="display: none;">│</span>

        <!-- Systray -->
        <div id="systray-wrapper" class="systray-wrapper" style="display: none;">
          <button id="systray-toggle" class="systray-toggle" title="Expand Systray"></button>
          <div id="systray-icons" class="systray-icons" style="display: none;"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        date: { type: 'date', formatting: 'ccc LLL dd, hh:mm a' },
        audio: { type: 'audio' },
        network: { type: 'network', refreshInterval: 2000 },
        cpu: { type: 'cpu', refreshInterval: 2000 },
        memory: { type: 'memory', refreshInterval: 2000 },
        disk: { type: 'disk', refreshInterval: 10000 },
        battery: { type: 'battery', refreshInterval: 10000 },
        media: { type: 'media' },
        systray: { type: 'systray' },
      });

      const el = {
        workspaces: document.getElementById('workspaces'),
        bindingModes: document.getElementById('binding-modes'),
        pausedBadge: document.getElementById('paused-badge'),
        windowSeparator: document.getElementById('window-separator'),
        windowTitle: document.getElementById('window-title'),
        windowTitleText: document.getElementById('window-title-text'),

        clockBlock: document.getElementById('clock-block'),
        clockText: document.getElementById('clock-text'),

        mediaPlayer: document.getElementById('media-player'),
        mediaSeparator: document.getElementById('media-separator'),
        mediaPrev: document.getElementById('media-prev'),
        mediaToggle: document.getElementById('media-toggle'),
        mediaNext: document.getElementById('media-next'),
        mediaTitle: document.getElementById('media-title'),
        mediaArtist: document.getElementById('media-artist'),

        volumeBlock: document.getElementById('volume-block'),
        volumeIcon: document.getElementById('volume-icon'),
        volumeText: document.getElementById('volume-text'),

        netBlock: document.getElementById('net-block'),
        netIcon: document.getElementById('net-icon'),
        netText: document.getElementById('net-text'),

        cpuBlock: document.getElementById('cpu-block'),
        cpuText: document.getElementById('cpu-text'),

        memBlock: document.getElementById('mem-block'),
        memText: document.getElementById('mem-text'),

        diskSeparator: document.getElementById('disk-separator'),
        diskBlock: document.getElementById('disk-block'),
        diskText: document.getElementById('disk-text'),

        batterySeparator: document.getElementById('battery-separator'),
        batteryBlock: document.getElementById('battery-block'),
        batteryIcon: document.getElementById('battery-icon'),
        batteryText: document.getElementById('battery-text'),

        systraySeparator: document.getElementById('systray-separator'),
        systrayWrapper: document.getElementById('systray-wrapper'),
        systrayToggle: document.getElementById('systray-toggle'),
        systrayIcons: document.getElementById('systray-icons'),
      };

      let latestOutput = providers.outputMap;
      let systrayExpanded = false;

      function formatSpeed(bytesPerSec) {
        if (!bytesPerSec || bytesPerSec <= 0) return '0 B/s';
        if (bytesPerSec < 1024) return `${Math.round(bytesPerSec)} B/s`;
        if (bytesPerSec < 1024 * 1024) return `${(bytesPerSec / 1024).toFixed(0)} KB/s`;
        if (bytesPerSec < 1024 * 1024 * 1024) return `${(bytesPerSec / (1024 * 1024)).toFixed(1)} MB/s`;
        return `${(bytesPerSec / (1024 * 1024 * 1024)).toFixed(1)} GB/s`;
      }

      function updateWorkspaces(glazewm) {
        if (!glazewm?.currentWorkspaces) return;
        const workspaces = glazewm.currentWorkspaces;

        let buttons = Array.from(el.workspaces.children);
        if (buttons.length !== workspaces.length) {
          el.workspaces.innerHTML = '';
          workspaces.forEach((ws) => {
            const btn = document.createElement('button');
            btn.className = 'ws-btn';
            btn.dataset.name = ws.name;
            btn.addEventListener('click', () => {
              latestOutput.glazewm?.runCommand(`focus --workspace ${ws.name}`);
            });
            el.workspaces.appendChild(btn);
          });
          buttons = Array.from(el.workspaces.children);
        }

        workspaces.forEach((ws, i) => {
          const btn = buttons[i];
          if (!btn) return;
          const displayName = ws.displayName ?? ws.name;
          if (btn.textContent !== displayName) btn.textContent = displayName;
          btn.title = `Workspace ${displayName}`;

          let stateClass = 'ws-inactive';
          if (ws.hasFocus) stateClass = 'ws-focused';
          else if (ws.isDisplayed) stateClass = 'ws-active';

          const fullClass = `ws-btn ${stateClass}`;
          if (btn.className !== fullClass) btn.className = fullClass;
        });
      }

      function updateBindingModes(glazewm) {
        const modes = glazewm?.bindingModes ?? [];
        el.bindingModes.innerHTML = '';
        modes.forEach((bm) => {
          const btn = document.createElement('button');
          btn.className = 'binding-mode-btn';
          btn.textContent = bm.displayName ?? bm.name;
          btn.title = 'Click to exit binding mode';
          btn.addEventListener('click', () => {
            latestOutput.glazewm?.runCommand(`wm-disable-binding-mode --name ${bm.name}`);
          });
          el.bindingModes.appendChild(btn);
        });
      }

      function updateGlazeWmControls(glazewm) {
        if (!glazewm) return;
        el.pausedBadge.style.display = glazewm.isPaused ? 'inline-flex' : 'none';
      }

      // ---------------------------------------------------------------------------
      // Real-time Active Window Tracking (GlazeWM WebSocket & Polling)
      // ---------------------------------------------------------------------------

      function setActiveWindowTitle(rawTitle, processName) {
        const title = rawTitle ? rawTitle.trim() : '';
        if (!title) {
          el.windowSeparator.style.display = 'none';
          el.windowTitle.style.display = 'none';
          return;
        }

        el.windowSeparator.style.display = 'inline-flex';
        el.windowTitle.style.display = 'inline-flex';
        if (el.windowTitleText.textContent !== title) {
          el.windowTitleText.textContent = title;
        }
        el.windowTitle.title = `${title} (${processName ?? 'Window'})`;
      }

      let gwSocket = null;
      function initGlazeWmSocket() {
        try {
          gwSocket = new WebSocket('ws://localhost:6123');
          gwSocket.onopen = () => {
            gwSocket.send('sub --events all');
            gwSocket.send('query focused');
          };
          gwSocket.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.messageType === 'client_response' && msg.data?.focused !== undefined) {
                const focused = msg.data.focused;
                if (focused && focused.type === 'window') {
                  setActiveWindowTitle(focused.title, focused.processName);
                } else {
                  setActiveWindowTitle(null);
                }
              } else if (msg.messageType === 'event_subscription') {
                gwSocket.send('query focused');
              }
            } catch (err) {
              // Ignore parse errors
            }
          };
          gwSocket.onclose = () => {
            setTimeout(initGlazeWmSocket, 2000);
          };
          gwSocket.onerror = () => {
            gwSocket?.close();
          };
        } catch (e) {
          // Socket fallback
        }
      }

      // 1-second heartbeat to catch in-window title changes (tab switches, terminal commands)
      setInterval(() => {
        if (gwSocket && gwSocket.readyState === WebSocket.OPEN) {
          gwSocket.send('query focused');
        }
      }, 1000);

      initGlazeWmSocket();

      // ---------------------------------------------------------------------------
      // Media & System Status Indicators
      // ---------------------------------------------------------------------------

      function updateMedia(media) {
        const session = media?.currentSession;
        if (!session || !session.title) {
          el.mediaPlayer.style.display = 'none';
          if (el.mediaSeparator) el.mediaSeparator.style.display = 'none';
          return;
        }

        el.mediaPlayer.style.display = 'inline-flex';
        if (el.mediaSeparator) el.mediaSeparator.style.display = 'inline-flex';
        el.mediaPlayer.title = `${session.title}${session.artist ? ' - ' + session.artist : ''}`;
        el.mediaTitle.textContent = session.title;
        el.mediaArtist.textContent = session.artist ? ` - ${session.artist}` : '';

        el.mediaToggle.textContent = session.isPlaying ? '󰏤' : '󰐊';
        el.mediaToggle.title = session.isPlaying ? 'Pause' : 'Play';
        el.mediaPrev.classList.toggle('disabled', !session.isPreviousEnabled);
        el.mediaNext.classList.toggle('disabled', !session.isNextEnabled);
      }

      function updateClock(date) {
        if (!date?.formatted) return;
        el.clockText.textContent = date.formatted;
      }

      function updateAudio(audio) {
        if (!audio) return;
        const dev = audio.defaultPlaybackDevice;
        const volume = dev?.volume != null ? Math.round(dev.volume) : 0;
        const isMuted = audio.isMuted || dev?.isMuted || false;

        el.volumeIcon.textContent = isMuted ? '󰝟' : '󰕾';
        el.volumeText.textContent = `${volume}%`;

        if (isMuted) {
          el.volumeBlock.classList.add('color-bad');
        } else {
          el.volumeBlock.classList.remove('color-bad');
        }
      }

      function updateNetwork(network) {
        if (!network) return;
        const ifaceType = network.defaultInterface?.type;
        const isConnected = !!ifaceType;
        const isWifi = ifaceType === 'wifi';
        const rxSpeed = network.traffic?.received?.bytes ?? 0;

        el.netIcon.textContent = isConnected ? (isWifi ? '' : '󰈀') : '󰖪';
        el.netText.textContent = isConnected ? ` ${formatSpeed(rxSpeed)}` : '';

        if (!isConnected) {
          el.netBlock.classList.add('color-bad');
          el.netBlock.title = 'No network connection';
        } else {
          el.netBlock.classList.remove('color-bad');
          el.netBlock.title = network.defaultGateway?.ssid
            ? `SSID: ${network.defaultGateway.ssid}`
            : `Interface: ${network.defaultInterface?.name ?? ifaceType}`;
        }
      }

      function updateCpu(cpu) {
        if (!cpu || cpu.usage == null) return;
        const usage = Math.round(cpu.usage);
        el.cpuText.textContent = `${String(usage).padStart(2, '0')}%`;

        el.cpuBlock.classList.remove('color-bad', 'color-degraded');
        if (usage > 85) el.cpuBlock.classList.add('color-bad');
        else if (usage > 60) el.cpuBlock.classList.add('color-degraded');
      }

      function updateMemory(memory) {
        if (!memory || memory.usedMemory == null) return;
        const memUsedGiB = (memory.usedMemory / 1073741824).toFixed(1);
        const memPercent = memory.usage ?? 0;
        el.memText.textContent = `${memUsedGiB} GiB`;
        el.memBlock.title = `RAM: ${memUsedGiB} GiB used (${Math.round(memPercent)}%)`;

        el.memBlock.classList.remove('color-bad', 'color-degraded');
        if (memPercent > 90) el.memBlock.classList.add('color-bad');
        else if (memPercent > 75) el.memBlock.classList.add('color-degraded');
      }

      function updateDisk(disk) {
        const diskList = disk?.disks ?? [];
        const primaryDisk = diskList.find((d) => d.mountPoint?.toUpperCase().startsWith('C')) || diskList[0];
        if (!primaryDisk?.availableSpace?.bytes) {
          el.diskSeparator.style.display = 'none';
          el.diskBlock.style.display = 'none';
          return;
        }

        el.diskSeparator.style.display = 'inline-flex';
        el.diskBlock.style.display = 'inline-flex';
        const availGiB = (primaryDisk.availableSpace.bytes / 1073741824).toFixed(1);
        el.diskText.textContent = `${availGiB} GiB`;
        el.diskBlock.title = `Disk (${primaryDisk.mountPoint}): ${availGiB} GiB available`;
      }

      function updateBattery(battery) {
        const hasBattery = battery && battery.chargePercent != null;
        if (!hasBattery) {
          el.batterySeparator.style.display = 'none';
          el.batteryBlock.style.display = 'none';
          return;
        }

        el.batterySeparator.style.display = 'inline-flex';
        el.batteryBlock.style.display = 'inline-flex';

        const pct = Math.round(battery.chargePercent);
        const isCharging = battery.isCharging || battery.state === 'charging';
        const icon = isCharging ? '󰂄' : pct <= 15 ? '󰂎' : '󰁹';

        el.batteryIcon.textContent = icon;
        el.batteryText.textContent = `${pct}%`;
        el.batteryBlock.title = `Battery: ${pct}% (${isCharging ? 'Charging' : 'Discharging'})`;

        if (pct <= 15 && !isCharging) {
          el.batteryBlock.classList.add('color-bad');
        } else {
          el.batteryBlock.classList.remove('color-bad');
        }
      }

      function updateSystray(systray) {
        const icons = systray?.icons ?? [];
        if (icons.length === 0) {
          el.systraySeparator.style.display = 'none';
          el.systrayWrapper.style.display = 'none';
          return;
        }

        el.systraySeparator.style.display = 'inline-flex';
        el.systrayWrapper.style.display = 'flex';

        el.systrayIcons.innerHTML = '';
        icons.forEach((icon) => {
          const img = document.createElement('img');
          img.className = 'systray-icon';
          img.src = icon.iconUrl;
          img.title = icon.tooltip || 'System Tray Icon';
          img.alt = '';
          img.addEventListener('click', (e) => {
            e.preventDefault();
            latestOutput.systray?.onLeftClick(icon.id);
          });
          img.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            latestOutput.systray?.onRightClick(icon.id);
          });
          el.systrayIcons.appendChild(img);
        });
      }

      function renderAll(output) {
        if (!output) return;
        latestOutput = output;
        updateWorkspaces(output.glazewm);
        updateBindingModes(output.glazewm);
        updateGlazeWmControls(output.glazewm);
        updateClock(output.date);
        updateMedia(output.media);
        updateAudio(output.audio);
        updateNetwork(output.network);
        updateCpu(output.cpu);
        updateMemory(output.memory);
        updateDisk(output.disk);
        updateBattery(output.battery);
        updateSystray(output.systray);
      }

      // Event handlers
      el.volumeBlock.addEventListener('click', () => {
        const audio = latestOutput.audio;
        if (!audio) return;
        const dev = audio.defaultPlaybackDevice;
        const isMuted = audio.isMuted || dev?.isMuted || false;
        audio.setMute(!isMuted);
      });

      el.volumeBlock.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        latestOutput.glazewm?.runCommand('shell-exec sndvol.exe');
      });

      el.volumeBlock.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const audio = latestOutput.audio;
          if (!audio) return;
          const dev = audio.defaultPlaybackDevice;
          const currentVol = dev?.volume != null ? Math.round(dev.volume) : 0;
          const delta = e.deltaY < 0 ? 5 : -5;
          const nextVol = Math.max(0, Math.min(100, currentVol + delta));
          audio.setVolume(nextVol);
        },
        { passive: false },
      );

      el.clockBlock.addEventListener('click', () => {
        latestOutput.glazewm?.runCommand('shell-exec explorer.exe ms-actioncenter:');
      });

      el.clockBlock.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        latestOutput.glazewm?.runCommand('shell-exec timedate.cpl');
      });

      el.netBlock.addEventListener('click', () => {
        latestOutput.glazewm?.runCommand('shell-exec explorer.exe ms-availablenetworks:');
      });

      el.netBlock.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        latestOutput.glazewm?.runCommand('shell-exec ncpa.cpl');
      });

      el.cpuBlock.addEventListener('click', () => {
        latestOutput.glazewm?.runCommand('shell-exec taskmgr.exe');
      });

      el.memBlock.addEventListener('click', () => {
        latestOutput.glazewm?.runCommand('shell-exec taskmgr.exe');
      });

      el.diskBlock.addEventListener('click', () => {
        latestOutput.glazewm?.runCommand('shell-exec explorer.exe');
      });

      el.batteryBlock.addEventListener('click', () => {
        latestOutput.glazewm?.runCommand('shell-exec explorer.exe ms-settings:powersleep');
      });

      el.pausedBadge.addEventListener('click', () => {
        latestOutput.glazewm?.runCommand('wm-toggle-pause');
      });

      // Media controls
      el.mediaPrev.addEventListener('click', (e) => {
        e.stopPropagation();
        latestOutput.media?.previous();
      });

      el.mediaToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        latestOutput.media?.togglePlayPause();
      });

      el.mediaNext.addEventListener('click', (e) => {
        e.stopPropagation();
        latestOutput.media?.next();
      });

      el.mediaTitle.addEventListener('click', () => {
        latestOutput.media?.togglePlayPause();
      });

      el.mediaPlayer.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          if (e.deltaY < 0) {
            latestOutput.media?.previous();
          } else {
            latestOutput.media?.next();
          }
        },
        { passive: false },
      );

      el.systrayToggle.addEventListener('click', () => {
        systrayExpanded = !systrayExpanded;
        el.systrayIcons.style.display = systrayExpanded ? 'flex' : 'none';
        el.systrayToggle.textContent = systrayExpanded ? '' : '';
        el.systrayToggle.title = systrayExpanded ? 'Collapse Systray' : 'Expand Systray';
      });

      providers.onOutput(() => {
        renderAll(providers.outputMap);
      });

      renderAll(providers.outputMap);
    </script>
  </body>
</html>
